<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Gabe's html gift for piating</title>
<style>
  html, body {
    margin: 0; padding: 0;
    background: radial-gradient(ellipse at center, #101826 70%, #000 100%);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: Georgia, serif;
    color: #ffb6c1;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  body {
    flex-direction: column;
    position: relative;
  }
  
  /* Heart intro container */
  #heartIntro {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 15rem;
    color: #fd6586;
    text-shadow:
      0 0 40px #fd6586CC,
      0 0 30px #fffbc188,
      0 0 60px #f8d3bb88;
    animation: heartPulseBig 1.8s infinite ease-in-out;
    z-index: 100;
    user-select: none;
  }
  @keyframes heartPulseBig {
    0%,100% { transform: translate(-50%, -50%) scale(1) rotate(-6deg);}
    45% { transform: translate(-50%, -50%) scale(1.2) rotate(6deg);}
    70% { transform: translate(-50%, -50%) scale(0.9) rotate(-6deg);}
  }
  
  /* Hide bouquet and page initially */
  #mainContent {
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
  }
  #mainContent.visible {
    opacity: 1;
    pointer-events: auto;
  }

  /* Envelope dialog with Yes/No */
  #envelopeDialog {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #ffe1e9;
    border-radius: 15px;
    box-shadow: 0 0 20px #ffbad8;
    padding: 24px 32px;
    z-index: 150;
    display: none;
    text-align: center;
    width: 300px;
    user-select: none;
  }
  #envelopeDialog[aria-hidden="true"] {
    display: none;
  }
  #envelopeTitle {
    font-size: 1.5rem;
    color: #d94a78;
    font-weight: bold;
    margin-bottom: 12px;
  }
  #envelopeDesc {
    font-size: 1rem;
    color: #aa5570;
    margin-bottom: 20px;
  }
  #btnYes, #btnNo {
    border: none;
    color: white;
    padding: 10px 20px;
    font-size: 1rem;
    border-radius: 10px;
    margin: 0 8px;
    cursor: pointer;
  }
  #btnYes {
    background-color: #fd6586;
  }
  #btnNo {
    background-color: #f2aab2;
    color: #661626;
  }
  #btnYes:focus, #btnNo:focus {
    outline: 2px solid #d94a78;
  }

  .container-main {
    display: flex; flex-direction: row; align-items: flex-end; justify-content: center;
    width: 100vw; height: 100vh; overflow: visible; position: relative;
    z-index: 1;
  }
  .bouquet {
    width: 90vw;
    max-width: 490px;
    height: auto;
    margin-right: 20px;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .bouquet.visible {
    opacity: 1;
  }
  .floating {
    position: absolute; user-select: none; pointer-events: none; z-index: 10;
    opacity: 0.9; animation: floatUp 4s linear infinite;
  }
  .heart { font-size: 1.7rem; color: #ff6a6e; text-shadow: 0 0 10px #ff8896, 0 0 8px #ff7eaa;}
  .dot {
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle, #fd6781 65%, #ff3b3b 100%);
    box-shadow: 0 0 20px 6px #ff4455cc, 0 0 10px 1px #ff0011cc;
  }
  .f1 { left: 170px; bottom: 70px; animation-delay: 0s; }
  .f2 { left: 225px; bottom: 55px; animation-delay: .8s;}
  .f3 { left: 260px; bottom: 65px; animation-delay: 2s;}
  .f4 { left: 350px; bottom: 108px; animation-delay: 2.7s;}
  .f5 { left: 110px; bottom: 110px; animation-delay: 2.6s;}
  .f6 { left: 49px; bottom: 35px; animation-delay: 1.3s;}
  .f7 { left: 415px; bottom: 40px; animation-delay: 2.9s;}
  .f8 { left: 390px; bottom: 140px; animation-delay: 1.4s;}
  .f9 { left: 228px; bottom: 130px; animation-delay: 2.1s;}
  .f10 { left: 365px; bottom: 13px; animation-delay: 1.1s;}
  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    90% { opacity: .94;}
    100% { transform: translateY(-110px) scale(.95); opacity: 0;}
  }
  .side-heart-anim {
    position: absolute; right: 70px; bottom: 35vh; font-size: 5rem;
    color: #fd6586; text-shadow: 0 0 24px #fd6586CC, 0 0 18px #fffbc188, 0 0 50px #f8d3bb88;
    animation: heartPulse 1.8s infinite ease-in-out; z-index: 11;
    filter: drop-shadow(0 0 35px #ffbad8b0);
    cursor: pointer; user-select: none;
  }
  @keyframes heartPulse {
    0%,100% { transform: scale(1) rotate(-6deg);}
    47% { transform: scale(1.18) rotate(6deg);}
    65% { transform: scale(0.97) rotate(-6deg);}
  }
  /* UPDATED caption CSS */
  .romantic-text {
    font-size: 1rem;
    text-align: center;
    margin: 0 auto 32px auto;
    padding: 0 4vw 1.5vw 4vw;
    max-width: 96vw;
    width: fit-content;
    box-sizing: border-box;
    z-index: 3;
    text-shadow: 0 0 8px #ffbbd8;
    color: #ffcccc;
    letter-spacing: .05em;
    word-break: break-word;
    line-height: 1.25;
  }
  @media (max-width: 600px) {
    .romantic-text {
      font-size: 1.15rem;
      padding: 0 2vw 2vw 2vw;
    }
    .container-main {
      flex-wrap: wrap;
      justify-content: center;
    }
    .bouquet {
      margin: 15px auto;
    }
  }
  
  /* Note popup styles */
  .heart-note {
    position: absolute; right: 130px; bottom: 57vh;
    background: rgba(255, 182, 193, 0.9); color: #4b002b;
    padding: 10px 16px; border-radius: 13px; font-family: 'Georgia', serif;
    font-size: 1.05rem; box-shadow: 0 0 15px #ffb6c1aa;
    user-select: none; pointer-events: none; opacity: 0; transform: translateY(20px);
    transition: opacity 0.4s, transform 0.4s; z-index: 12; white-space: nowrap;
  }
  .heart-note.show { opacity: 1; transform: translateY(0);}
  
  /* Petal rain container */
  .petal-rain {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 15;
    overflow: visible;
  }
  .petal {
    position: absolute;
    top: -30px;
    width: 15px; height: 18px;
    background: radial-gradient(circle at 50% 50%, #ff4d4d 76%, #c30000 95%);
    border-radius: 50% 50% 60% 60% / 75% 75% 25% 25%;
    opacity: 0.9;
    filter: drop-shadow(0 0 5px #ff6a6a);
    animation-name: fallPetal;
    animation-duration: 8s;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-fill-mode: forwards;
  }
  @keyframes fallPetal {
    to {
      transform: translateY(110vh) rotate(360deg) scale(0.8);
      opacity: 0;
    }
    from {
      transform: translateY(0) rotate(0deg) scale(1);
      opacity: 0.95;
    }
  }
</style>

<script>
  // Elements
  const heartIntro = document.getElementById('heartIntro');
  const mainContent = document.getElementById('mainContent');
  const envelopeDialog = document.getElementById('envelopeDialog');
  const btnYes = document.getElementById('btnYes');
  const btnNo = document.getElementById('btnNo');
  const heart = document.getElementById('rightHeart');
  const note = document.getElementById('heartNote');

  const introDuration = 4000;

  // Show / hide note on heart click or key
  function showNote() {
    note.classList.add('show');
    setTimeout(() => note.classList.remove('show'), 4000);
  }
  heart.addEventListener('click', showNote);
  heart.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      showNote();
    }
  });

  // Generate infinite falling red petals randomly across viewport
  const petalContainer = document.getElementById('petalRain');
  const petalCount = 100; // number of petals

  for(let i=0; i<petalCount; i++) {
    const petal = document.createElement('div');
    petal.classList.add('petal');
    
    // Random horizontal start position (0vw to 100vw)
    petal.style.left = (Math.random() * 100) + 'vw';
    
    // Random animation duration between 6s and 9s for variety
    petal.style.animationDuration = (6 + Math.random() * 3) + 's';
    
    // Random animation delay
    petal.style.animationDelay = (Math.random() * 8) + 's';
    
    // Random rotation start angle
    petal.style.transform = `rotate(${Math.random() * 360}deg)`;
    
    petalContainer.appendChild(petal);
  }

  // After intro, fade out heartIntro and show envelope dialog
  window.addEventListener('load', () => {
    setTimeout(() => {
      heartIntro.style.transition = "opacity 1s ease";
      heartIntro.style.opacity = '0';

      setTimeout(() => {
        heartIntro.style.display = 'none';
        envelopeDialog.style.display = 'block';
        envelopeDialog.setAttribute('aria-hidden', 'false');
        envelopeDialog.focus();
      }, 1000);
    }, introDuration);
  });

  // Fade in bouquets one by one with delay
  function fadeInBouquetsSequentially() {
    mainContent.classList.add('visible');
    mainContent.setAttribute('aria-hidden', 'false');
    
    const bouquets = document.querySelectorAll('.bouquet');
    
    bouquets.forEach(bouquet => {
      bouquet.classList.remove('visible'); // Reset, just in case
    });
    
    bouquets.forEach((bouquet, index) => {
      setTimeout(() => {
        bouquet.classList.add('visible');
      }, index * 800); // 800ms delay between each
    });
  }

  // Yes button click - hide envelope dialog and show bouquets
  btnYes.addEventListener('click', () => {
    envelopeDialog.style.transition = 'opacity 0.5s ease';
    envelopeDialog.style.opacity = '0';
    setTimeout(() => {
      envelopeDialog.style.display = 'none';
      envelopeDialog.setAttribute('aria-hidden', 'true');
      fadeInBouquetsSequentially();
    }, 500);
  });

  // No button click - hide envelope dialog
  btnNo.addEventListener('click', () => {
    envelopeDialog.style.transition = 'opacity 0.5s ease';
    envelopeDialog.style.opacity = '0';
    setTimeout(() => {
      envelopeDialog.style.display = 'none';
      envelopeDialog.setAttribute('aria-hidden', 'true');
      // Optional: add a message or other logic if needed
    }, 500);
  });
</script>
