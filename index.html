<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabe Oms ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff7f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Courier New", monospace;
}

/* ANIMATED PIXEL HEART BACKGROUND */

#heartBackground {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.pixel-heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #f4a5bd;
    box-shadow:
        6px 0 #f4a5bd,
        18px 0 #f4a5bd,
        24px 0 #f4a5bd,
        0 6px #f4a5bd,
        6px 6px #f4a5bd,
        12px 6px #f4a5bd,
        18px 6px #f4a5bd,
        24px 6px #f4a5bd,
        30px 6px #f4a5bd,
        0 12px #f4a5bd,
        6px 12px #f4a5bd,
        12px 12px #f4a5bd,
        18px 12px #f4a5bd,
        24px 12px #f4a5bd,
        30px 12px #f4a5bd,
        6px 18px #f4a5bd,
        12px 18px #f4a5bd,
        18px 18px #f4a5bd,
        24px 18px #f4a5bd,
        12px 24px #f4a5bd,
        18px 24px #f4a5bd;
    transform: scale(var(--scale));
    opacity: 0;
    animation: heartFall var(--duration) linear infinite;
    animation-delay: var(--delay);
}

.pixel-heart.white {
    background: #fff;
    box-shadow:
        6px 0 #fff,
        18px 0 #fff,
        24px 0 #fff,
        0 6px #fff,
        6px 6px #fff,
        12px 6px #fff,
        18px 6px #fff,
        24px 6px #fff,
        30px 6px #fff,
        0 12px #fff,
        6px 12px #fff,
        12px 12px #fff,
        18px 12px #fff,
        24px 12px #fff,
        30px 12px #fff,
        6px 18px #fff,
        12px 18px #fff,
        18px 18px #fff,
        24px 18px #fff,
        12px 24px #fff,
        18px 24px #fff;
}

@keyframes heartFall {
    0% {
        transform: translateY(-100px) scale(var(--scale)) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: var(--opacity);
    }
    90% {
        opacity: var(--opacity);
    }
    100% {
        transform: translateY(110vh) scale(var(--scale)) rotate(30deg);
        opacity: 0;
    }
}

/* INTRO */

#intro {
    position: fixed;
    inset: 0;
    background: #fff7f5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #d77e9c;
    z-index: 10;
    padding: 20px;
    transition: opacity 1s ease;
}

#intro h1 {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 15px;
}

#intro p {
    color: #bd8999;
    font-size: 13px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
}

button {
    padding: 12px 28px;
    border: 2px solid #e9a1b9;
    background: #fff0f4;
    color: #c66d8d;
    font-family: inherit;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e9a1b9;
    color: white;
}

button:disabled {
    opacity: 0.4;
    cursor: default;
}

button:disabled:hover {
    background: #fff0f4;
    color: #c66d8d;
}

/* LETTER PAPER */

.paper {
    position: relative;
    z-index: 2;
    width: min(92vw, 480px);
    max-height: 88vh;
    min-height: 400px;
    background: #fffafa;
    padding: 30px 25px 35px 40px;
    transform: rotate(-2deg);
    box-shadow: 0 0 35px #e8b5c4;
    border: 3px solid #f3b3c7;
    opacity: 0;
    overflow-y: auto;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
    scrollbar-color: #e9a1b9 #fff0f4;
}

.paper::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px dashed #f1bfd0;
    pointer-events: none;
}

/* MUSIC TOGGLE BUTTON */

.music-toggle-btn {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 10;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 12px;
    border: 1px solid #e9a1b9;
    background: #fff0f4;
    color: #c66d8d;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
}

.music-toggle-btn:hover {
    background: #e9a1b9;
    color: white;
}

.holes {
    position: absolute;
    left: 10px;
    top: 10px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.holes span {
    width: 13px;
    height: 13px;
    background: #fff0f4;
    border-radius: 50%;
    border: 1px solid #edb4c5;
}

/* PICTURES */

.pictures {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
}

.pictures img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border: 6px solid #f2a5bd;
    outline: 3px solid #e989a9;
    outline-offset: 2px;
    box-shadow:
        0 3px 0 #d77d9d,
        3px 3px 0 #d77d9d,
        0 5px 12px #e8c1cd;
    border-radius: 0;
}

.picture-caption {
    text-align: center;
    font-size: 10px;
    color: #c77d98;
    margin-top: 10px;
    margin-bottom: 22px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
}

/* MESSAGE */

#message {
    font-size: 12px;
    line-height: 1.9;
    color: #704c59;
    white-space: pre-wrap;
    text-align: left;
    position: relative;
    z-index: 1;
}

.signature {
    text-align: right;
    margin-top: 20px;
    font-size: 23px;
    color: #df91ad;
    position: relative;
    z-index: 1;
}

#noMessage {
    display: none;
    color: #bd8999;
    text-align: center;
    font-size: 14px;
    line-height: 2;
    margin-top: 30px;
}

/* ===== BUTTONS CONTAINER ===== */

.letter-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 22px;
    position: relative;
    z-index: 5;
}

.album-btn, .sons-btn {
    display: block;
    width: 100%;
    font-size: 12px;
    text-align: center;
}

/* ===== PHOTO ALBUM ===== */

#album {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 18px;
    background: rgba(255, 240, 245, 0.94);
    backdrop-filter: blur(3px);
}

#album.open {
    display: flex;
}

.album-book {
    position: relative;
    width: min(94vw, 520px);
    max-height: 82vh;
    overflow-y: auto;
    background: #fffafa;
    border: 3px solid #f3b3c7;
    box-shadow: 0 0 35px #e8b5c4;
    padding: 22px 18px 18px;
    scrollbar-width: thin;
    scrollbar-color: #e9a1b9 #fff0f4;
}

.album-book::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px dashed #f1bfd0;
    pointer-events: none;
}

.album-title {
    position: relative;
    text-align: center;
    font-size: 12px;
    letter-spacing: 2px;
    color: #c77d98;
    margin-bottom: 16px;
}

/* 6 PHOTOS PER PAGE - 3 COLUMNS AND 2 ROWS */

.album-grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

/* PHOTO SIZE */

.album-grid img {
    width: 100%;
    height: 190px;
    object-fit: cover;
    border: 6px solid #f2a5bd;
    outline: 3px solid #e989a9;
    outline-offset: 2px;
    box-shadow:
        0 3px 0 #d77d9d,
        3px 3px 0 #d77d9d,
        0 5px 12px #e8c1cd;
    border-radius: 0;
    cursor: pointer;
}

.album-nav {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    gap: 10px;
}

.album-nav button {
    padding: 9px 16px;
    font-size: 12px;
}

.album-close {
    font-size: 12px;
    padding: 9px 22px;
}

/* ===== OUR SONS MODAL ===== */

#sonsModal {
    position: fixed;
    inset: 0;
    z-index: 60;
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 14px;
    padding: 18px;
    background: rgba(255, 240, 245, 0.94);
    backdrop-filter: blur(3px);
}

#sonsModal.open {
    display: flex;
}

.sons-book {
    position: relative;
    width: min(94vw, 420px);
    background: #fffafa;
    border: 3px solid #f3b3c7;
    box-shadow: 0 0 35px #e8b5c4;
    padding: 22px 22px 24px;
    text-align: center;
}

.sons-book::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px dashed #f1bfd0;
    pointer-events: none;
}

.sons-content {
    position: relative;
    z-index: 1;
}

.sons-content img {
    width: 100%;
    height: 260px;
    object-fit: cover;
    border: 6px solid #f2a5bd;
    outline: 3px solid #e989a9;
    outline-offset: 2px;
    box-shadow:
        0 3px 0 #d77d9d,
        3px 3px 0 #d77d9d,
        0 5px 12px #e8c1cd;
    margin-bottom: 14px;
    cursor: pointer;
}

.sons-name {
    font-size: 13px;
    letter-spacing: 1px;
    color: #c77d98;
    margin-bottom: 4px;
}

/* FULL-SCREEN PHOTO VIEWER */

#photoViewer {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(20, 10, 15, 0.92);
    display: none;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#photoViewer.open {
    display: flex;
}

#fullPhoto {
    max-width: 95vw;
    max-height: 90vh;
    width: auto;
    height: auto;
    object-fit: contain;
    border: 5px solid #f2a5bd;
    box-shadow: 0 0 25px #e8b5c4;
}

#closeViewer {
    position: absolute;
    top: 20px;
    right: 20px;
    color: white;
    background: #c66d8d;
    border: 1px solid white;
    font-size: 22px;
    padding: 8px 15px;
    z-index: 1;
}

/* MOBILE */

@media (max-width: 400px) {
    .paper {
        padding: 25px 18px 30px 32px;
    }

    .pictures img {
        height: 155px;
    }

    #message {
        font-size: 11px;
    }

    .album-grid img {
        height: 155px;
        border-width: 6px;
    }

    .album-grid {
        gap: 9px;
    }

    .album-nav button {
        padding: 8px 12px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- HEART BACKGROUND -->
<div id="heartBackground"></div>

<!-- MUSIC -->

<!-- INTRO -->

</div>

<script>

/* INFINITE PIXEL HEARTS */

const heartBackground = document.getElementById("heartBackground");

function createHearts() {

    for (let i = 0; i < 65; i++) {

        const heart = document.createElement("div");

        heart.className = "pixel-heart";

        if (Math.random() > 0.5) {
            heart.classList.add("white");
        }

        heart.style.left = Math.random() * 100 + "vw";
        heart.style.top = "-50px";

        heart.style.setProperty(
            "--scale",
            (Math.random() * 0.8 + 0.4).toFixed(2)
        );

        heart.style.setProperty(
            "--duration",
            (Math.random() * 7 + 6) + "s"
        );

        heart.style.setProperty(
            "--delay",
            (-Math.random() * 15) + "s"
        );

        heart.style.setProperty(
            "--opacity",
            (Math.random() * 0.5 + 0.3).toFixed(2)
        );

        heartBackground.appendChild(heart);

    }

}

createHearts();

/* ROMANTIC MESSAGE */

const text = `Babyy, ikaw ra ahong e marry puhon babyy and maka uban sa ahong future.


I want us to build a beautiful life babyy, have a family, live comfortably and happily.


Ato e reach atong dreams and goals sa life together babyy, and naa rako nimo always babyy ko.


I lovee you very very much babyy! - gabe ♡`;

let index = 0;

function typeWriter() {

    if (index < text.length) {

        document.getElementById("message").textContent +=
            text.charAt(index);

        index++;

        setTimeout(typeWriter, 55);
    }
}

/* AUDIO MANAGERS */

const music1 = document.getElementById("bgMusic");
const music2 = document.getElementById("sparksMusic");
let currentTrack = 1;

const CHORUS_1 = 60;
const DURATION_1 = 60;

/* Sparks starts at 1:49 (109 seconds) */
const CHORUS_2 = 109;
const DURATION_2 = 60;

function handleLoop(audio, startTime, duration) {
    if (audio.currentTime >= startTime + duration) {
        audio.currentTime = startTime;
    }
}

music1.addEventListener("timeupdate", () => {
    if (currentTrack === 1) handleLoop(music1, CHORUS_1, DURATION_1);
});

music2.addEventListener("timeupdate", () => {
    if (currentTrack === 2) handleLoop(music2, CHORUS_2, DURATION_2);
});

function playTrack(trackNumber) {
    music1.pause();
    music2.pause();

    const btn = document.getElementById("musicBtn");

    if (trackNumber === 1) {
        currentTrack = 1;
        music1.volume = 0.3;
        music1.currentTime = CHORUS_1;
        music1.play().catch(err => console.error("Music error:", err));
        btn.textContent = "♡♫";
    } else {
        currentTrack = 2;
        music2.volume = 0.3;
        music2.currentTime = CHORUS_2;
        music2.play().catch(err => console.error("Music error:", err));
        btn.textContent = "♥♫";
    }
}

function toggleMusic() {
    if (currentTrack === 1) {
        playTrack(2);
    } else {
        playTrack(1);
    }
}

/* OPEN LETTER */

function openLetter() {

    const intro = document.getElementById("intro");
    const paper = document.getElementById("paper");

    playTrack(1);

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";

        paper.style.opacity = "1";

        setTimeout(typeWriter, 1000);

    }, 1000);

}

/* DON'T OPEN */

function dontOpen() {

    document.getElementById("noMessage").style.display = "block";

    document.querySelector(".buttons").style.display = "none";

}

/* GO BACK */

function goBack() {

    document.getElementById("noMessage").style.display = "none";

    document.querySelector(".buttons").style.display = "flex";

}

/* ===== OUR SONS PHOTO VIEWER ===== */

const SONS_PHOTOS = [
    { src: "cappy.jpeg", name: "Cappy" },
    { src: "ice.jpeg", name: "Ice" },
    { src: "cappy ice.jpeg", name: "Cappy & Ice" }
];

let currentSonIndex = 0;

function renderSonPage() {
    const son = SONS_PHOTOS[currentSonIndex];
    document.getElementById("sonImage").src = son.src;
    document.getElementById("sonName").textContent = son.name;

    document.getElementById("sonPrevBtn").disabled = currentSonIndex === 0;
    document.getElementById("sonNextBtn").disabled = currentSonIndex === SONS_PHOTOS.length - 1;
}

function openSons() {
    currentSonIndex = 0;
    renderSonPage();
    document.getElementById("sonsModal").classList.add("open");
}

function closeSons() {
    document.getElementById("sonsModal").classList.remove("open");
}

function nextSonPage() {
    if (currentSonIndex < SONS_PHOTOS.length - 1) {
        currentSonIndex++;
        renderSonPage();
    }
}

function prevSonPage() {
    if (currentSonIndex > 0) {
        currentSonIndex--;
        renderSonPage();
    }
}

function openFullSonPhoto() {
    const viewer = document.getElementById("photoViewer");
    const fullPhoto = document.getElementById("fullPhoto");
    fullPhoto.src = SONS_PHOTOS[currentSonIndex].src;
    viewer.classList.add("open");
}

/* ===== PHOTO ALBUM ===== */

/* All 28 picture files. Rename here if a filename differs. */

const ALL_PHOTOS = [
    "att.DHZSQPAzJRSKFiwBeaYdqJKxlxlI7PKXi-WUAL38QKM.jpeg",
    "att.wRm2M6qyr8QzfPCxTWGgdWTdJ4Mr0UeuRGhi9QGnzIc.jpeg",
    "IMG_1639.jpeg",
    "IMG_2230.jpeg",
    "IMG_2488.jpeg",
    "IMG_2910 (1).jpeg",
    "IMG_4434.jpeg",
    "IMG_5744.jpeg",
    "IMG_5755.jpeg",
    "IMG_6393.jpeg",
    "IMG_6407.jpeg",
    "IMG_6582.jpeg",
    "IMG_6723.jpeg",
    "IMG_6778.jpeg",
    "IMG_6958.jpeg",
    "KAPI_SF2604131303305987809.jpeg",
    "KAPI_SF2604201051011084813.jpeg",
    "KAPI_SF2606301506241624964.jpeg",
    "KAPI_SF2609011134141282701.png",
    "KAPI_SF2609190907243449467.jpeg",
    "KAPI_SF2609190909193141839.jpeg",
    "KAPI_SF2609190912107602283.jpeg",
    "KAPI_SF2609241313218566031.png",
    "KAPI_SF2609241313218978740.jpeg",
    "KAPI_SF2609241313219313156.jpeg",
    "KAPI_SF2610011042472239686.jpeg",
    "KAPI_SF2610011517055284724.jpeg",
    "temp_image_058106E0-371C-43B6-9A9C-1CC9188C4C64.jpeg"
];

const PHOTOS_PER_PAGE = 6;
const TOTAL_PAGES = 5;

let albumPages = [];
let currentPage = 0;

function shuffle(array) {

    const copy = array.slice();

    for (let i = copy.length - 1; i > 0; i--) {

        const j = Math.floor(Math.random() * (i + 1));

        [copy[i], copy[j]] = [copy[j], copy[i]];
    }

    return copy;
}

function buildAlbumPages() {

    let pool = shuffle(ALL_PHOTOS);

    while (pool.length < PHOTOS_PER_PAGE * TOTAL_PAGES) {

        const extra = shuffle(ALL_PHOTOS).filter(
            file => !pool.includes(file)
        );

        if (extra.length === 0) break;

        pool = pool.concat(extra);
    }

    pool = pool.slice(0, PHOTOS_PER_PAGE * TOTAL_PAGES);

    albumPages = [];

    for (let p = 0; p < TOTAL_PAGES; p++) {

        albumPages.push(
            pool.slice(p * PHOTOS_PER_PAGE, (p + 1) * PHOTOS_PER_PAGE)
        );
    }

}

/* ERROR MESSAGE */

function showError(msg) {

    let bar = document.getElementById("errorBar");

    if (!bar) {

        bar = document.createElement("div");

        bar.id = "errorBar";

        bar.style.cssText =
            "position:fixed;top:0;left:0;right:0;z-index:99;" +
            "background:#c66d8d;color:#fff;font-size:12px;" +
            "padding:10px 14px;font-family:monospace;white-space:pre-wrap;";

        document.body.appendChild(bar);
    }

    bar.textContent = "Album error: " + msg;
}

/* DISPLAY ALBUM PAGE */

function renderPage() {

    const grid = document.getElementById("albumGrid");

    if (!grid) {
        showError("albumGrid not found in the HTML");
        return;
    }

    grid.innerHTML = "";

    albumPages[currentPage].forEach(file => {

        const img = document.createElement("img");

        img.src = file;
        img.alt = "Our photo";
        img.loading = "lazy";

        img.onerror = () => {
            img.style.opacity = "0.35";
        };

        grid.appendChild(img);

    });

    document.getElementById("prevBtn").disabled = currentPage === 0;

    document.getElementById("nextBtn").disabled =
        currentPage === TOTAL_PAGES - 1;

}

/* OPEN ALBUM */

function openAlbum() {

    try {

        if (albumPages.length === 0) {
            buildAlbumPages();
        }

        currentPage = 0;

        renderPage();

        document.getElementById("album").classList.add("open");

    } catch (err) {

        showError(err.message);

    }

}

/* CLOSE ALBUM */

function closeAlbum() {
    document.getElementById("album").classList.remove("open");
    closePhotoViewer();
}

/* OPEN PHOTO IN FULL SCREEN */

const albumGrid = document.getElementById("albumGrid");

albumGrid.addEventListener("click", function(e) {

    if (e.target.tagName === "IMG") {

        const viewer = document.getElementById("photoViewer");
        const fullPhoto = document.getElementById("fullPhoto");

        fullPhoto.src = e.target.src;

        viewer.classList.add("open");
    }

});

/* CLOSE FULL-SCREEN PHOTO */

function closePhotoViewer() {
    document.getElementById("photoViewer").classList.remove("open");
}

/* NEXT PAGE */

function nextPage() {

    if (currentPage < TOTAL_PAGES - 1) {

        currentPage++;

        renderPage();

        document.querySelector(".album-book").scrollTop = 0;
    }

}

/* PREVIOUS PAGE */

function prevPage() {

    if (currentPage > 0) {

        currentPage--;

        renderPage();

        document.querySelector(".album-book").scrollTop = 0;
    }

}

/* KEYBOARD CONTROLS */

document.addEventListener("keydown", function (e) {

    const albumOpen = document.getElementById("album").classList.contains("open");
    const sonsOpen = document.getElementById("sonsModal").classList.contains("open");

    if (albumOpen) {
        if (e.key === "ArrowRight") nextPage();
        if (e.key === "ArrowLeft") prevPage();
    }

    if (sonsOpen) {
        if (e.key === "ArrowRight") nextSonPage();
        if (e.key === "ArrowLeft") prevSonPage();
    }

    if (e.key === "Escape") {
        closePhotoViewer();
        closeAlbum();
        closeSons();
    }

});

</script>

</body>
</html>
