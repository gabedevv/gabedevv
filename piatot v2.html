
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gabe Oms ♡</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #fff7f5;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: "Courier New", monospace;
}

/* ANIMATED PIXEL HEART BACKGROUND */

#heartBackground {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.pixel-heart {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #f4a5bd;
    box-shadow:
        6px 0 #f4a5bd,
        18px 0 #f4a5bd,
        24px 0 #f4a5bd,
        0 6px #f4a5bd,
        6px 6px #f4a5bd,
        12px 6px #f4a5bd,
        18px 6px #f4a5bd,
        24px 6px #f4a5bd,
        30px 6px #f4a5bd,
        0 12px #f4a5bd,
        6px 12px #f4a5bd,
        12px 12px #f4a5bd,
        18px 12px #f4a5bd,
        24px 12px #f4a5bd,
        30px 12px #f4a5bd,
        6px 18px #f4a5bd,
        12px 18px #f4a5bd,
        18px 18px #f4a5bd,
        24px 18px #f4a5bd,
        12px 24px #f4a5bd,
        18px 24px #f4a5bd;
    transform: scale(var(--scale));
    opacity: 0;
    animation: heartFall var(--duration) linear infinite;
    animation-delay: var(--delay);
}

.pixel-heart.white {
    background: #fff;
    box-shadow:
        6px 0 #fff,
        18px 0 #fff,
        24px 0 #fff,
        0 6px #fff,
        6px 6px #fff,
        12px 6px #fff,
        18px 6px #fff,
        24px 6px #fff,
        30px 6px #fff,
        0 12px #fff,
        6px 12px #fff,
        12px 12px #fff,
        18px 12px #fff,
        24px 12px #fff,
        30px 12px #fff,
        6px 18px #fff,
        12px 18px #fff,
        18px 18px #fff,
        24px 18px #fff,
        12px 24px #fff,
        18px 24px #fff;
}

@keyframes heartFall {
    0% {
        transform: translateY(-100px) scale(var(--scale)) rotate(0deg);
        opacity: 0;
    }
    10% {
        opacity: var(--opacity);
    }
    90% {
        opacity: var(--opacity);
    }
    100% {
        transform: translateY(110vh) scale(var(--scale)) rotate(30deg);
        opacity: 0;
    }
}

/* INTRO */

#intro {
    position: fixed;
    inset: 0;
    background: #fff7f5;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #d77e9c;
    z-index: 10;
    padding: 20px;
    transition: opacity 1s ease;
}

#intro h1 {
    font-size: 25px;
    font-weight: normal;
    margin-bottom: 15px;
}

#intro p {
    color: #bd8999;
    font-size: 13px;
    margin-bottom: 35px;
}

.buttons {
    display: flex;
    gap: 15px;
}

button {
    padding: 12px 28px;
    border: 2px solid #e9a1b9;
    background: #fff0f4;
    color: #c66d8d;
    font-family: inherit;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #e9a1b9;
    color: white;
}

/* LETTER PAPER */

.paper {
    position: relative;
    z-index: 2;
    width: min(92vw, 480px);
    max-height: 88vh;
    min-height: 400px;
    background: #fffafa;
    padding: 30px 25px 35px 40px;
    transform: rotate(-2deg);
    box-shadow: 0 0 35px #e8b5c4;
    border: 3px solid #f3b3c7;
    opacity: 0;
    overflow-y: auto;
    transition: opacity 1.5s ease;
    scrollbar-width: thin;
    scrollbar-color: #e9a1b9 #fff0f4;
}

.paper::before {
    content: "";
    position: absolute;
    inset: 7px;
    border: 2px dashed #f1bfd0;
    pointer-events: none;
}

.holes {
    position: absolute;
    left: 10px;
    top: 10px;
    bottom: 10px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.holes span {
    width: 13px;
    height: 13px;
    background: #fff0f4;
    border-radius: 50%;
    border: 1px solid #edb4c5;
}

/* PICTURES */

.pictures {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    margin-bottom: 22px;
    position: relative;
    z-index: 1;
}

.pictures img {
    width: 100%;
    height: 190px;
    object-fit: cover;

    /* PIXEL PINK BORDER */
    border: 6px solid #f2a5bd;
    outline: 3px solid #e989a9;
    outline-offset: 2px;

    box-shadow:
        0 3px 0 #d77d9d,
        3px 3px 0 #d77d9d,
        0 5px 12px #e8c1cd;

    border-radius: 0;
    image-rendering: auto;
}

.picture-caption {
    text-align: center;
    font-size: 10px;
    color: #c77d98;
    margin-top: 10px;
    margin-bottom: 22px;
    letter-spacing: 1px;
    position: relative;
    z-index: 1;
}

/* MESSAGE */

#message {
    font-size: 12px;
    line-height: 1.9;
    color: #704c59;
    white-space: pre-wrap;
    text-align: left;
    position: relative;
    z-index: 1;
}

.signature {
    text-align: right;
    margin-top: 20px;
    font-size: 23px;
    color: #df91ad;
    position: relative;
    z-index: 1;
}

#noMessage {
    display: none;
    color: #bd8999;
    text-align: center;
    font-size: 14px;
    line-height: 2;
    margin-top: 30px;
}

/* MOBILE */

@media (max-width: 400px) {
    .paper {
        padding: 25px 18px 30px 32px;
    }

    .pictures img {
        height: 155px;
    }

    #message {
        font-size: 11px;
    }
}
</style>
</head>

<body>

<!-- HEART BACKGROUND -->
<div id="heartBackground"></div>

<!-- MUSIC -->
<audio id="bgMusic" preload="auto" loop>
    <source src="coming-up-roses.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->

<div id="intro">

    <h1>for you again my babyy ♡</h1>
    <p>Letter sa Chinabank babyy!</p>

    <div class="buttons">
        <button onclick="openLetter()">Yes</button>
        <button onclick="dontOpen()">Don't Open</button>
    </div>

    <div id="noMessage">
        k, my babyy.<br>
        gebot will not pugos if ayaw mo bb. ♡
        <br><br>
        <button onclick="goBack()">Go Back</button>
    </div>

</div>

<!-- LETTER -->

<div class="paper" id="paper">

    <div class="holes">
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span><span></span>
        <span></span><span></span>
    </div>

    <div class="pictures">

        <img src="IMG_6492.jpeg" alt="Our first picture">

        <img src="IMG_6494.jpeg" alt="Our second picture">

    </div>

    <div class="picture-caption">
        US, TOGETHER AFTER SIMBA ♡
    </div>

    <!-- ROMANTIC MESSAGE -->

    <div id="message"></div>

    <div class="signature">♡</div>

</div>

<script>

/* INFINITE PIXEL HEARTS */

const heartBackground = document.getElementById("heartBackground");

function createHearts() {

    for (let i = 0; i < 65; i++) {

        const heart = document.createElement("div");

        heart.className = "pixel-heart";

        if (Math.random() > 0.5) {
            heart.classList.add("white");
        }

        heart.style.left = Math.random() * 100 + "vw";

        heart.style.top = "-50px";

        heart.style.setProperty(
            "--scale",
            (Math.random() * 0.8 + 0.4).toFixed(2)
        );

        heart.style.setProperty(
            "--duration",
            (Math.random() * 7 + 6) + "s"
        );

        heart.style.setProperty(
            "--delay",
            (-Math.random() * 15) + "s"
        );

        heart.style.setProperty(
            "--opacity",
            (Math.random() * 0.5 + 0.3).toFixed(2)
        );

        heartBackground.appendChild(heart);

    }

}

createHearts();

/* ROMANTIC MESSAGE */

const text = `Babyy, ikaw ra ahong e marry puhon babyy and maka uban sa ahong future.

I want us to build a beautiful life babyy, have a family, live comfortably and happily.

Ato e reach atong dreams and goals sa life together babyy, and naa rako nimo always babyy ko.

I lovee you very very much babyy! - gabe ♡`;

let index = 0;

function typeWriter() {

    if (index < text.length) {

        document.getElementById("message").textContent +=
            text.charAt(index);

        index++;

        setTimeout(typeWriter, 55);
    }
}

/* OPEN LETTER */

function openLetter() {

    const intro = document.getElementById("intro");
    const paper = document.getElementById("paper");
    const music = document.getElementById("bgMusic");

    const CHORUS_TIMESTAMP = 60;

    music.volume = 0.3;

    function startMusicAtChorus() {

        const target = Math.min(
            CHORUS_TIMESTAMP,
            Math.max(0, music.duration - 0.5)
        );

        music.currentTime = target;

        const playPromise = music.play();

        if (playPromise !== undefined) {
            playPromise.catch(error => {
                console.error("Music could not play:", error);
                alert("Make sure coming-up-roses.mp3 is in the same folder as this HTML file.");
            });
        }
    }

    if (music.readyState >= 1) {
        startMusicAtChorus();
    } else {
        music.addEventListener(
            "loadedmetadata",
            startMusicAtChorus,
            { once: true }
        );

        music.load();
    }

    intro.style.opacity = "0";

    setTimeout(() => {

        intro.style.display = "none";

        paper.style.opacity = "1";

        setTimeout(typeWriter, 1000);

    }, 1000);

}

/* DON'T OPEN */

function dontOpen() {

    document.getElementById("noMessage").style.display = "block";

    document.querySelector(".buttons").style.display = "none";

}

/* GO BACK */

function goBack() {

    document.getElementById("noMessage").style.display = "none";

    document.querySelector(".buttons").style.display = "flex";

}

</script>

</body>
</html>
